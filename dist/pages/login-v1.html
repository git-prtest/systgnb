<!-- Script para el efecto de movimiento del fondo -->
<script>
  document.addEventListener('mousemove', (e) => {
    const bg = document.getElementById('parallax-bg');
    // Calculamos la posición relativa del mouse (-1 a 1) y la multiplicamos por la sensibilidad deseada (20px)
    const x = (e.clientX / window.innerWidth - 0.5) * 20;
    const y = (e.clientY / window.innerHeight - 0.5) * 20;
    // Aplicamos la transformación manteniendo el scale(1.1) para evitar bordes vacíos
    bg.style.transform = `scale(1.1) translate(${x}px, ${y}px)`;
  });
</script>
